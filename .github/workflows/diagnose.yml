name: 提取固件构建失败日志
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 本仓库失败的固件构建编号
        required: true
        type: string
permissions:
  actions: read
  contents: read
  checks: write
jobs:
  diagnose:
    name: Extract build failures
    runs-on: ubuntu-24.04
    steps:
      - name: Validate source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/source-run.json
          python3 -c 'import json; r=json.load(open("/tmp/source-run.json")); assert r["path"]==".github/workflows/build.yml"; assert r["status"]=="completed"'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: Athena-*-logs-*
          path: failure-logs
      - name: Extract errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections=[]
          for path in sorted(Path('failure-logs').rglob('*.log')):
              lines=path.read_text(errors='replace').splitlines()
              tail='\n'.join(lines[-130:])[-24000:]
              sections.append('### '+path.name+'\n\n```text\n'+tail+'\n```')
          if not sections:
              raise SystemExit('No build logs found in artifacts')
          text='\n\n'.join(sections)
          Path('diagnostic.txt').write_text(text)
          PY
          cat diagnostic.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Expose diagnostic through Checks API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: context.runId });
            const job = jobs.find(j => j.name === 'Extract build failures');
            if (!job) throw new Error('Current diagnostic job not found');
            await github.rest.checks.update({ owner, repo, check_run_id: job.id, output: {
              title: 'Firmware failure log excerpts', summary: fs.readFileSync('diagnostic.txt', 'utf8')
            }});
